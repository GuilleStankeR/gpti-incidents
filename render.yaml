databases:
  - name: gpti-incidents-db
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    databaseName: incidents
    user: incidents

services:
  - type: web
    name: gpti-incidents-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:production -w @incidents/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: gpti-incidents-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: API_PORT
        value: '10000'
      - key: STORAGE_DRIVER
        value: database
      - key: STORAGE_DIR
        value: ./storage
      - key: MAX_FILE_SIZE_MB
        value: '5'
      - key: MAX_FILES_PER_UPLOAD
        value: '5'
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org/reverse
      - key: NOMINATIM_USER_AGENT
        value: FolioSpA-Incidents/1.0
      - key: NOMINATIM_TIMEOUT_MS
        value: '3000'
      - key: TIME_ZONE
        value: America/Santiago
      - key: CORS_ORIGINS
        value: https://gpti-incidents.vercel.app
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: LOGIN_MAX_ATTEMPTS_PER_MINUTE
        value: '10'
